
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | Agro Guard</title>

    <script>
        if (new URLSearchParams(window.location.search).get("embed") === "1") {
            document.documentElement.classList.add("embedded");
        }
    </script>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/global.css">

</head>
<body data-resource="users">

    <main class="layout">

        <aside class="sidebar">
            <div class="sidebar-logo">AG</div>

            <nav class="sidebar-nav">
                <button href="#" class="sidebar-btn active"><img src="./icons/Grupio.svg"></button>
                <button href="#" class="sidebar-btn"><img src="./icons/Vila.svg"></button>
                <button href="#" class="sidebar-btn"><img src="./icons/Trabalho.svg"></button>
            </nav>
        </aside>

        <header class="topbar">
            <h1 class="page-title">Usuários</h1>

            <div class="topbar-actions">
                <input
                    class="search-input"
                    type="text"
                    placeholder="Buscar por ID, nome ou e-mail"
                >

                <button class="btn-primary" id="open-form" type="button">
                    + Novo usuário
                </button>
            </div>
        </header>

        <section class="content">

            <div class="table-header">
                <span class="table-description">Lista de usuários cadastrados</span>
            </div>

            <div class="table-wrapper">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>CPF</th>
                            <th>Perfil</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="record-table-body">
                        <tr><td colspan="6">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>


              <section class="secao_publicar desfoque" id="form-dialog" aria-label="Cadastro de usuário" hidden>
            <div class="container-btn-fechar">
                <button id="close-form" type="button" aria-label="Fechar cadastro"><img src="./icons/close.svg" alt=""></button>
            </div>
    
            <form class="formula" id="record-form">
                <h2 class="form-title" id="form-title">Cadastrar usuário</h2>
                <input type="hidden" name="id" id="record-id">
                <input type="text" name="name" placeholder="Nome completo" autocomplete="name" required>
                <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
                <input type="text" name="cpf" placeholder="CPF" inputmode="numeric" pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}" required>
                <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
                <button type="submit" id="save-button">Cadastrar usuário</button>
            </form>
            </section>
    </main>

</body>
<script src="script.js"></script>
</html>
