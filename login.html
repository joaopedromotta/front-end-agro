<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123d49">
    <title>Entrar | Agro Guard</title>

    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
</head> 

<body>
    <main class="login-page">
        <section class="login login-section" aria-labelledby="login-title">
            <a class="login-brand" href="./login.html" aria-label="Agro Guard">
                <span class="login-brand__mark" aria-hidden="true">AG</span>
                <span>Agro<span>Guard</span></span>
            </a>
            <p class="login-eyebrow">GESTÃO RURAL</p>
            <h1 class="login__texto" id="login-title">Boas-vindas</h1>
            <p class="login-description">Entre com sua conta de administrador para acessar o painel.</p>
            <form class="form__login" id="formulario-login">
                <label for="formulario-email">E-mail</label>
                <input
                    type="email"
                    id="formulario-email"
                    name="email"
                    class="box login__email"
                    placeholder="nome@exemplo.com"
                    autocomplete="username"
                    required
                >
                <label for="formulario-senha">Senha</label>
                <input
                    type="password"
                    id="formulario-senha"
                    name="password"
                    class="box login__password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
                <p class="login-error" id="login-error" role="alert" aria-live="polite" hidden></p>
                <button class="btn btn__login-enter" type="submit" id="botao-entrar">Entrar</button>
            </form>
        </section>
    </main>
    <script src="./login.js"></script>
</body>

</html>
