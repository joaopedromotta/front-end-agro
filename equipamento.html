<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipamentos | Agro Guard</title>
    <script>
        if (new URLSearchParams(window.location.search).get("embed") === "1") {
            document.documentElement.classList.add("embedded");
        }
    </script>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/global.css">
</head>
<body data-resource="equipments">
    <main class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">AG</div>
            <nav class="sidebar-nav" aria-label="Seções">
                <a class="sidebar-btn active" href="../index.html" aria-label="Voltar ao painel">
                    <img src="./icons/Grupio.svg" alt="">
                </a>
            </nav>
        </aside>

        <header class="topbar">
            <h1 class="page-title">Equipamentos</h1>
            <div class="topbar-actions">
                <select class="search-input" id="property-filter" aria-label="Filtrar por propriedade">
                    <option value="">Todas as propriedades</option>
                </select>
                <input class="search-input" type="search" placeholder="Buscar equipamentos" aria-label="Buscar equipamentos">
                <button class="btn-primary" id="open-form" type="button">+ Novo equipamento</button>
            </div>
        </header>

        <section class="content">
            <div class="table-header">
                <span class="table-description">Equipamentos cadastrados na operação</span>
            </div>
            <div class="table-wrapper">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Status</th>
                            <th>Propriedade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="record-table-body">
                        <tr><td colspan="6">Carregando equipamentos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="secao_publicar" id="form-dialog" aria-label="Cadastro de equipamento" hidden>
            <div class="container-btn-fechar">
                <button id="close-form" type="button" aria-label="Fechar cadastro">
                    <img src="./icons/close.svg" alt="">
                </button>
            </div>
            <form class="formula" id="record-form">
                <h2 class="form-title" id="form-title">Cadastrar equipamento</h2>
                <input type="hidden" name="id" id="record-id">
                <input type="text" name="name" placeholder="Nome do equipamento" required>
                <select name="type" required>
                    <option value="">Selecione o tipo</option>
                    <option value="CAMERA">Câmera</option>
                    <option value="SENSOR_MOVIMENTO">Sensor de movimento</option>
                    <option value="ALARME">Alarme</option>
                    <option value="CERCA_ELETRICA">Cerca elétrica</option>
                    <option value="DRONE">Drone</option>
                    <option value="RADIO_COMUNICADOR">Rádio comunicador</option>
                    <option value="MAQUINARIO_GERAL">Maquinário geral</option>
                    <option value="OUTRO">Outro</option>
                </select>
                <select name="status" required>
                    <option value="">Selecione o status</option>
                    <option value="ATIVO">Ativo</option>
                    <option value="INATIVO">Inativo</option>
                    <option value="EM_MANUTENCAO">Em manutenção</option>
                    <option value="DANIFICADO">Danificado</option>
                    <option value="DESCARTADO">Descartado</option>
                </select>
                <select name="propertyId" id="propertyId" required>
                    <option value="">Selecione a propriedade</option>
                </select>
                <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
                <button type="submit" id="save-button">Cadastrar equipamento</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
